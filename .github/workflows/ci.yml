name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Subsystems
    runs-on: ubuntu-latest
    outputs:
      home-phone: ${{ steps.filter.outputs.home-phone }}
      remote-phone: ${{ steps.filter.outputs.remote-phone }}
      computer: ${{ steps.filter.outputs.computer }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            home-phone:
              - 'wakeonlanhomephone/**'
              - '.github/workflows/ci.yml'
            remote-phone:
              - 'wakeonwanremotephone/**'
              - '.github/workflows/ci.yml'
            computer:
              - 'computer/**'
              - 'pc_onoff.exe'
              - '.github/workflows/ci.yml'

  build-home-phone:
    name: Build Home Phone (Wake-on-LAN Helper)
    needs: detect-changes
    if: needs.detect-changes.outputs.home-phone == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wakeonlanhomephone

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests & Assemble Release APK
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Upload Home Phone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wakeonlan-home-phone-apk
          path: wakeonlanhomephone/app/build/outputs/apk/release/*.apk
          retention-days: 14

  build-remote-phone:
    name: Build Remote Phone (Wake-on-WAN Remote)
    needs: detect-changes
    if: needs.detect-changes.outputs.remote-phone == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wakeonwanremotephone

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Check Kotlin & Assemble Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Remote Phone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wakeonwan-remote-phone-apk
          path: wakeonwanremotephone/app/build/outputs/apk/release/*.apk
          retention-days: 14

  build-computer:
    name: Build & Test Computer Daemon (Rust & Python)
    needs: detect-changes
    if: needs.detect-changes.outputs.computer == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python Script Syntax
        run: python -m py_compile computer/pc_onoff.py

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check
        working-directory: computer

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: computer

      - name: Run Rust Unit Tests
        run: cargo test --verbose
        working-directory: computer

      - name: Build Linux Release Binary
        run: |
          cargo build --release
          strip target/release/pc_onoff
        working-directory: computer

      - name: Upload Linux Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pc_onoff-linux-x86_64
          path: computer/target/release/pc_onoff
          retention-days: 14
