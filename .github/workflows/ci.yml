name: Android CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-home-phone:
    name: Build Home Phone (Wake-on-LAN Helper)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wakeonlanhomephone

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Check Kotlin & Assemble Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Home Phone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wakeonlan-home-phone-apk
          path: wakeonlanhomephone/app/build/outputs/apk/release/*.apk
          retention-days: 14

  build-remote-phone:
    name: Build Remote Phone (Wake-on-WAN Remote)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wakeonwanremotephone

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Check Kotlin & Assemble Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Remote Phone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wakeonwan-remote-phone-apk
          path: wakeonwanremotephone/app/build/outputs/apk/release/*.apk
          retention-days: 14

  verify-computer-script:
    name: Verify Computer Listener Script
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile and Verify Python Syntax
        run: python -m py_compile computer/pc_onoff.py
